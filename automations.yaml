- id: smoke_sensor_triggered
  alias: "\U0001F525 Smoke Alarm TESTING \U0001F525"
  description: ''
  triggers:
  - trigger: template
    value_template: "{%- for sensor in states.binary_sensor if (sensor.entity_id).endswith('smoke')
      -%}\n  {{ is_state(sensor.entity_id, 'on') }}\n{% endfor %}"
  actions:
  - action: notify.all_devices
    data:
      message: "\U0001F525 Smoke Alarm \U0001F525\n{{ trigger.event.data.new_state.attributes.friendly_name
        | replace('_','\\_') }} has changed state to: {{ trigger.event.data.new_state.state
        }}"
      data:
        sticky: true
  mode: restart
