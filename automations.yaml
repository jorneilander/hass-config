- id: '1780732841442'
  alias: LetsEncrypt - Renew certificate
  description: ''
  triggers:
  - trigger: time
    at: 05:00:00
  conditions: []
  actions:
  - action: hassio.app_start
    metadata: {}
    data:
      app: core_letsencrypt
  mode: single
- id: '1780734376731'
  alias: LetsEncrypt - Restart Home Assistant
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - event.folder_watcher_ssl
    attribute: event_type
    to:
    - modified
    - created
  conditions: []
  actions:
  - delay:
      hours: 0
      minutes: 15
      seconds: 0
      milliseconds: 0
    enabled: true
  - action: notify.send_message
    metadata: {}
    target:
      entity_id: notify.jorns_iphone
    data:
      message: Certificate renewed, restarting Home Assistant
      title: Certificate renewd
  - action: homeassistant.restart
    metadata: {}
    data: {}
    enabled: true
  mode: restart
- id: '1780749524283'
  alias: Certificates - - External - Expiring
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.certificates_expiring
    to:
    - 'on'
    from:
  conditions: []
  actions:
  - action: notify.send_message
    metadata: {}
    target:
      entity_id: notify.jorns_iphone
    data:
      message: Your certs need updating!
  - action: notify.persistent_notification
    metadata: {}
    data:
      title: External certificates need updating
  mode: single
