---
id: notify_when_front_door_opened
alias: Hallway - Notify when any door opened
triggers:
  - platform: state
    entity_id: binary_sensor.hallway_door_sensor_contact
    from: "off"
    to: "on"
  - platform: state
    entity_id: binary_sensor.living_room_door_sensor_contact
    from: "off"
    to: "on"
actions:
  - alias: "Turn on hallway light"
    service: light.turn_on
    data:
        brightness_pct: 40
    target:
      entity_id: light.hallway_light
  - delay: 0:02
  - alias: "Turn off hallway light"
    service: light.turn_off
    target:
      entity_id: light.hallway_light
