---
# Residual grid power: DSMR total consumption minus every individually metered
# device. The plug list is dynamic: any sensor with device_class "power" and
# unit "W" counts as a known user, except this sensor itself and the DSMR grid
# sensors (total, per-phase, returned). New plugs are picked up automatically.
# To exclude another sensor, add a condition in the plug_sensors loop below.
name: Unknown power draw
default_entity_id: sensor.unknown_power_draw
unique_id: D8D87FBE-5A64-4CC9-8E41-B88BC3158C65
device_class: power
state_class: measurement
unit_of_measurement: W
icon: mdi:eye
variables:
  grid_sensor: sensor.dsmr_reader_power_consumed
  plug_sensors: >
    {%- set ns = namespace(result=[]) -%}
    {%- for plug in states.sensor
       | selectattr('attributes.device_class', 'eq', 'power')
       | selectattr('attributes.unit_of_measurement', 'eq', 'W') -%}
      {%- if plug.entity_id != 'sensor.unknown_power_draw'
         and not plug.entity_id.startswith('sensor.dsmr_reader_') -%}
        {%- set ns.result = ns.result + [plug.entity_id] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.result }}
  known_power: >
    {%- set ns = namespace(total=0) -%}
    {%- for plug_sensor in plug_sensors -%}
      {%- if has_value(plug_sensor) -%}
        {%- set ns.total = ns.total + states(plug_sensor)|float(0) -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.total }}
  skipped_plug_sensors: >
    {%- set ns = namespace(skipped=[]) -%}
    {%- for plug_sensor in plug_sensors -%}
      {%- if not has_value(plug_sensor) -%}
        {%- set ns.skipped = ns.skipped + [plug_sensor] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.skipped }}
availability: "{{ has_value(grid_sensor) and plug_sensors | length > 0 }}"
state: >
  {{ [states(grid_sensor)|float(0) - known_power|float(0), 0]|max|round(1) }}
attributes:
  skipped_plug_sensors: "{{ skipped_plug_sensors | join(', ') }}"
