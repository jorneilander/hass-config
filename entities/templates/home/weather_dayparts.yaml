---
# Tomorrow's weather split into dayparts (morning 06-12, afternoon 12-18,
# evening/night 18-06), built from the OpenWeatherMap hourly forecast. Shown on
# the wall panel dashboard. Refreshed every 30 minutes and on startup.
# Note: the response_variable is only used inside `attributes` (the documented
# scope), not in `variables`, so a failed/missing response can't break rendering.
- name: Weather tomorrow dayparts
  default_entity_id: sensor.weather_tomorrow_dayparts
  unique_id: weather_tomorrow_dayparts
  icon: mdi:weather-partly-cloudy
  trigger:
    - platform: time_pattern
      minutes: "/30"
    - platform: homeassistant
      event: start
  action:
    - action: weather.get_forecasts
      target:
        entity_id: weather.openweathermap
      data:
        type: hourly
      response_variable: hourly_forecast
  state: "{{ now().strftime('%H:%M') }}"
  attributes:
    morning: >-
      {%- set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
      {%- set labels = {'clear-night': 'heldere nacht', 'cloudy': 'bewolkt', 'exceptional': 'uitzonderlijk',
        'fog': 'mist', 'hail': 'hagel', 'lightning': 'onweer', 'lightning-rainy': 'onweer met regen',
        'partlycloudy': 'halfbewolkt', 'pouring': 'stortbui', 'rainy': 'regen', 'snowy': 'sneeuw',
        'snowy-rainy': 'natte sneeuw', 'sunny': 'zonnig', 'windy': 'winderig', 'windy-variant': 'winderig'} -%}
      {%- set ns = namespace(fs=[]) -%}
      {%- for forecast in hourly_forecast['weather.openweathermap'].forecast -%}
        {%- if forecast.datetime[:10] == tomorrow and 6 <= forecast.datetime[11:13] | int < 12 -%}
          {%- set ns.fs = ns.fs + [forecast] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if ns.fs | length == 0 -%}
        Onbekend
      {%- else -%}
        {%- set mid = ns.fs[ns.fs | length // 2] -%}
        {{ labels[mid.condition] | default(mid.condition) }},
        {{ ns.fs | map(attribute='temperature') | min | round(1) }}–{{ ns.fs | map(attribute='temperature') | max | round(1) }} °C,
        regen {{ (ns.fs | map(attribute='precipitation_probability') | select('number') | list | max | default(0)) | int }}%
      {%- endif -%}
    afternoon: >-
      {%- set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
      {%- set labels = {'clear-night': 'heldere nacht', 'cloudy': 'bewolkt', 'exceptional': 'uitzonderlijk',
        'fog': 'mist', 'hail': 'hagel', 'lightning': 'onweer', 'lightning-rainy': 'onweer met regen',
        'partlycloudy': 'halfbewolkt', 'pouring': 'stortbui', 'rainy': 'regen', 'snowy': 'sneeuw',
        'snowy-rainy': 'natte sneeuw', 'sunny': 'zonnig', 'windy': 'winderig', 'windy-variant': 'winderig'} -%}
      {%- set ns = namespace(fs=[]) -%}
      {%- for forecast in hourly_forecast['weather.openweathermap'].forecast -%}
        {%- if forecast.datetime[:10] == tomorrow and 12 <= forecast.datetime[11:13] | int < 18 -%}
          {%- set ns.fs = ns.fs + [forecast] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if ns.fs | length == 0 -%}
        Onbekend
      {%- else -%}
        {%- set mid = ns.fs[ns.fs | length // 2] -%}
        {{ labels[mid.condition] | default(mid.condition) }},
        {{ ns.fs | map(attribute='temperature') | min | round(1) }}–{{ ns.fs | map(attribute='temperature') | max | round(1) }} °C,
        regen {{ (ns.fs | map(attribute='precipitation_probability') | select('number') | list | max | default(0)) | int }}%
      {%- endif -%}
    evening: >-
      {%- set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
      {%- set labels = {'clear-night': 'heldere nacht', 'cloudy': 'bewolkt', 'exceptional': 'uitzonderlijk',
        'fog': 'mist', 'hail': 'hagel', 'lightning': 'onweer', 'lightning-rainy': 'onweer met regen',
        'partlycloudy': 'halfbewolkt', 'pouring': 'stortbui', 'rainy': 'regen', 'snowy': 'sneeuw',
        'snowy-rainy': 'natte sneeuw', 'sunny': 'zonnig', 'windy': 'winderig', 'windy-variant': 'winderig'} -%}
      {%- set ns = namespace(fs=[]) -%}
      {%- for forecast in hourly_forecast['weather.openweathermap'].forecast -%}
        {%- if forecast.datetime[:10] == tomorrow and not 6 <= forecast.datetime[11:13] | int < 18 -%}
          {%- set ns.fs = ns.fs + [forecast] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if ns.fs | length == 0 -%}
        Onbekend
      {%- else -%}
        {%- set mid = ns.fs[ns.fs | length // 2] -%}
        {{ labels[mid.condition] | default(mid.condition) }},
        {{ ns.fs | map(attribute='temperature') | min | round(1) }}–{{ ns.fs | map(attribute='temperature') | max | round(1) }} °C,
        regen {{ (ns.fs | map(attribute='precipitation_probability') | select('number') | list | max | default(0)) | int }}%
      {%- endif -%}
