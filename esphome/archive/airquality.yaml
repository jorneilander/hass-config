substitutions:
  name: "airquality"
  friendly_name: "Airquality"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    then:
      - light.turn_on:
          id: RGBLed
          effect: random
          brightness: 25%

esp32:
  board: esp32s3box
  flash_size: 16MB
  framework:
    type: arduino
    # version: latest
    # platform_version:  5.3.0
  variant: ESP32S3

psram:
  mode: octal

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret device_api_encryption_key
  actions:
    - action: mhz19_calibrate_zero
      then:
        - mhz19.calibrate_zero: mhz19_sensor

switch:
  - platform: template
    name: "Display"
    lambda: |-
      if (id(display_main).is_on())
      {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      then:
        - lambda: id(display_main).turn_on();
    turn_off_action:
      then:
        - lambda: id(display_main).turn_off();

ota:
  - platform: esphome
    password: !secret device_ota_password

wifi:
  ssid: !secret home_wifi_iot_ssid
  password: !secret home_wifi_iot_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Fallback Hotspot"
    password: !secret device_wifi_fallback_password

  domain: .home.cannonfodder.nl

web_server:
  port: 80

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time

light:
  - platform: esp32_rmt_led_strip
    id: RGBLed
    rgb_order: GRB
    chipset: WS2812
    pin: GPIO48
    num_leds: 1
    name: "RGBLed"
    rmt_channel: 0
    effects:
      - pulse:
      - random:
          update_interval:
            milliseconds: 550
          transition_length:
            milliseconds: 550

uart:
  - id: UART_1
    tx_pin: GPIO16
    rx_pin: GPIO15
    baud_rate: 9600
  - id: UART_0
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 9600
    debug:
      direction: BOTH
      dummy_receiver: false
      after:
        delimiter: "\n"
      sequence:
        - lambda: UARTDebug::log_string(direction, bytes);
    # rx_buffer_size: 32

sensor:
  - platform: mhz19
    id: mhz19_sensor
    uart_id: UART_1
    update_interval: 10s
    co2:
      name: MH-Z19 CO2 Value
      id: co2_value
      force_update: True
    temperature:
      name: MH-Z19 Temperature
      internal: True
  - platform: pmsx003
    uart_id: UART_0
    update_interval: 300s
    type: PMSX003
    pm_1_0:
      id: pm_1_0
      name: "Particulate Matter <1.0um Concentration"
      force_update: True
    pm_2_5:
      id: pm_2_5
      name: "Particulate Matter <2.5um Concentration"
      force_update: True
    pm_10_0:
      id: pm_10_0
      name: "Particulate Matter <10.0um Concentration"
      force_update: True
  - platform: sgp4x
    update_interval: 10s
    voc:
      name: "VOC Index"
      id: voc_index
    nox:
      name: "NOx Index"
      id: nox_index
  - platform: tsl2561
    name: "TSL2561 Ambient Light"
    id: lux
    # address: 0x39
    update_interval: 1s
  - platform: debug
    free:
      name: "Heap Free"
    # fragmentation:
    #   name: "Heap Fragmentation"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
    psram:
      name: "Free PSRAM"
  - platform: wifi_signal
    name: '${friendly_name} WiFi Signal'
    update_interval: 60s
    accuracy_decimals: 0
  - platform: uptime
    name: '${friendly_name} Uptime'
    unit_of_measurement: days
    update_interval: 300s
    accuracy_decimals: 1
    filters:
      - multiply: 0.000011574      


### DISPLAY ###

i2c:
  sda: GPIO08
  scl: GPIO09

font:
  - file: "gfonts://Roboto+Flex"
    id: roboto_20
    size: 10

display:
  - id: display_main
    platform: ssd1306_i2c
    model: "SSD1306 128x64"
    # reset_pin: D0
    address: 0x3C
    update_interval: 5s
    lambda: |-
      if (id(pm_1_0).has_state()) {
        it.printf(0, 0, id(roboto_20), "%s", "<1.0um");
        it.printf(it.get_width(), 0, id(roboto_20), TextAlign::TOP_RIGHT, "%.0f ppm", id(pm_1_0).state);
      }
      else {
        it.printf(0, 0, id(roboto_20), "%s", "<1.0um");
        it.printf(it.get_width(), 0, id(roboto_20), TextAlign::TOP_RIGHT, "%s", "Starting...");
      }

      if (id(pm_2_5).has_state()) {
        it.printf(0, 10, id(roboto_20), "%s", "<2.5um");
        it.printf(it.get_width(), 10, id(roboto_20), TextAlign::TOP_RIGHT, "%.0f ppm", id(pm_2_5).state);
      }
      else {
        it.printf(0, 10, id(roboto_20), "%s", "<2.5um");
        it.printf(it.get_width(), 10, id(roboto_20), TextAlign::TOP_RIGHT, "%s", "Starting...");
      }

      if (id(pm_10_0).has_state()) {
        it.printf(0, 20, id(roboto_20), "%s", "<10.0um");
        it.printf(it.get_width(), 20, id(roboto_20), TextAlign::TOP_RIGHT, "%.0f ppm", id(pm_10_0).state);
      }
      else {
        it.printf(0, 20, id(roboto_20), "%s", "<10.0um");
        it.printf(it.get_width(), 20, id(roboto_20), TextAlign::TOP_RIGHT, "%s", "Starting...");
      }

      if (id(co2_value).has_state()) {
        it.printf(0, 30, id(roboto_20), "%s", "CO2");
        it.printf(it.get_width(), 30, id(roboto_20), TextAlign::TOP_RIGHT, "%.0f ppm", id(co2_value).state);
      }
      else {
        it.printf(0, 30, id(roboto_20), "%s", "CO2");
        it.printf(it.get_width(), 30, id(roboto_20), TextAlign::TOP_RIGHT, "%s", "Starting...");
      }

      if (id(voc_index).has_state()) {
        it.printf(0, 40, id(roboto_20), "%s", "VOC Index");
        it.printf(it.get_width(), 40, id(roboto_20), TextAlign::TOP_RIGHT, "%.0f", id(voc_index).state);
      }
      else {
        it.printf(0, 40, id(roboto_20), "%s", "VOC Index");
        it.printf(it.get_width(), 40, id(roboto_20), TextAlign::TOP_RIGHT, "%s", "Starting...");
      }

      if (id(nox_index).has_state()) {
        it.printf(0, 50, id(roboto_20), "%s", "NOx Index");
        it.printf(it.get_width(), 50, id(roboto_20), TextAlign::TOP_RIGHT, "%.0f", id(nox_index).state);
      }
      else {
        it.printf(0, 50, id(roboto_20), "%s", "NOx Index");
        it.printf(it.get_width(), 50, id(roboto_20), TextAlign::TOP_RIGHT, "%s", "Starting...");
      }

# Example configuration entry
debug:
  update_interval: 5s

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"
  - platform: version
    name: "${friendly_name} ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP address"
    ssid:
      name: "${friendly_name} SSID"      