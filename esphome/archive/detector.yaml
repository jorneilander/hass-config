esphome:
  name: detector

esp32:
  board: esp32s3box
  flash_size: 16MB
  variant: ESP32S3

# Enable logging
logger:
  level: DEBUG
  # baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: "MdMwLQpOp1mefjWHCoomzrvVtH+BQPqn7vqq/Y2OfIw="
  actions:
    - action: set_ld2410_bluetooth_password
      variables:
        password: string
      then:
        - bluetooth_password.set:
            id: my_ld2410
            password: !lambda 'return password;'

ota:
  - platform: esphome
    password: "AlbEb3cq0Ukap6zFAXoJIHtYjXK4H7nIquawVEaiF9NLED6FWn"

wifi:
  ssid: YGGDRASIL_IOT
  password: zscjzgVD_wZFp!@qV.Mtg8uUpNe@3_eZ

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "detector Fallback Hotspot"
    password: "LUfLjcKNtH5d9ui"

web_server:
  port: 80

# Example configuration entry
uart:
  - id: uart2410
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

ld2410:
  uart_id: uart2410
  id: my_ld2410

