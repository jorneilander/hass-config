---
# Tasmota "SP111 v1.1" plug (10.0.1.63), migrated to ESPHome.
# Pin mapping read from the device's own Tasmota template (cmnd=Template).
substitutions:
  device_name: utility-closet-smart-plug
  friendly_name: "Utility closet - Smart plug"
  relay_pin: GPIO11
  button_pin: GPIO9
  sel_pin: GPIO8
  cf_pin: GPIO5
  cf1_pin: GPIO4

packages:
  common: !include common/common_1m.yaml
  wifi: !include common/wifi.yaml
  plug: !include common/plug_bl0937.yaml

esp8266:
  board: esp8285
  flash_size: 1MB

status_led:
  pin:
    number: GPIO2
    inverted: true
